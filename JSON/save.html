<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L0 - Save and Load User Notes</title>
</head>
<body>

    <h2>Save & Load User Notes</h2>

    <!-- Textarea where user writes notes -->
    <textarea id="notesArea" rows="6" cols="40" placeholder="Write your notes here..."></textarea>
    <br><br>

    <!-- Buttons -->
    <button id="saveBtn">Save Notes</button>
    <button id="loadBtn">Load Notes</button>
    <button id="clearBtn">Clear Notes</button>

    <script>
        // Selecting required elements
        const notesArea = document.getElementById("notesArea");
        const saveBtn = document.getElementById("saveBtn");
        const loadBtn = document.getElementById("loadBtn");
        const clearBtn = document.getElementById("clearBtn");

        // --- Load Notes Automatically on Page Load ---
        window.addEventListener("load", () => {
            const savedNotes = localStorage.getItem("userNotes");

            // If saved notes exist in storage, show them in the textarea
            if (savedNotes) {
                notesArea.value = savedNotes;
            }
        });

        // --- Save Notes when Save Button is Clicked ---
        saveBtn.addEventListener("click", () => {
            const text = notesArea.value.trim();

            // Validation: Don't save empty notes
            if (text === "") {
                alert("Please write something before saving.");
                return;
            }

            // Save to localStorage
            localStorage.setItem("userNotes", text);
            alert("Notes saved successfully!");
        });

        // --- Load Notes manually when Load Button is Clicked ---
        loadBtn.addEventListener("click", () => {
            const savedNotes = localStorage.getItem("userNotes");

            if (savedNotes) {
                notesArea.value = savedNotes;
            } else {
                alert("No saved notes found.");
            }
        });

        // --- Clear Notes when Clear Button is Clicked ---
        clearBtn.addEventListener("click", () => {
            localStorage.removeItem("userNotes");
            notesArea.value = ""; // Clear textarea visually
            alert("Notes cleared successfully!");
        });

    </script>

</body>
</html>
